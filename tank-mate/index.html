<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TankMates</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@700;800&family=Noto+Color+Emoji&display=swap">
<style>
/* Layout: sticky glass header + views; content max 1240; phone gets bottom tab bar with a raised "Plan" button. Deep-water dark first, clear-water light second. */
:root{
 --bg:#04131A;--bg2:#071E27;--surface:#0B2630;--surface2:#10313C;--surface3:#163E4A;--glass:rgba(14,46,56,.62);--line:#1C4351;--line2:#25566A;
 --ink:#EAF7F5;--muted:#93B6B1;--faint:#5E8580;--accent:#2BD4BD;--accent2:#3AA8FF;--accent-ink:#022620;--lime:#B4F04B;--lime-ink:#152304;--coral:#FF7A59;--violet:#A78BFA;--gold:#FBBF24;
 --good:#45D483;--warn:#F6B740;--bad:#FF6A57;--good-bg:rgba(69,212,131,.15);--warn-bg:rgba(246,183,64,.16);--bad-bg:rgba(255,106,87,.16);
 --shadow:0 18px 50px -22px rgba(0,0,0,.7);--spot:radial-gradient(120% 90% at 50% 30%,#1C5361 0%,#0B2A33 55%,#061A21 100%);
 --w1:#1B6E78;--w2:#0E4A55;--w3:#06303A;--air:#0A1F26;--cab1:#2A2F33;--cab2:#14181B;
 --sea1:#0E5A73;--sea2:#0A3F55;--land:#0E2A33;--grid:rgba(255,255,255,.035);--road:#1E4A57;--road2:#2B6578;--maplabel:#7FB0AA;
 --hero:radial-gradient(1000px 520px at 75% -10%,rgba(43,212,189,.28),transparent 60%),radial-gradient(800px 500px at 0% 30%,rgba(58,168,255,.16),transparent 60%),linear-gradient(180deg,#062430 0%,#04131A 100%);
 --display:"Sora","Avenir Next","Segoe UI",sans-serif;--body:"Manrope","Segoe UI",system-ui,sans-serif;color-scheme:dark}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
 --bg:#EEF6F6;--bg2:#E3F0F1;--surface:#FFFFFF;--surface2:#EBF5F5;--surface3:#DDEDED;--glass:rgba(255,255,255,.78);--line:#D3E4E4;--line2:#BFD8D8;
 --ink:#0A2A30;--muted:#4E6E6E;--faint:#7E9A99;--accent:#0A9A88;--accent2:#1B7FD6;--accent-ink:#FFFFFF;--lime:#4D9A12;--lime-ink:#FFFFFF;--coral:#E8553A;--violet:#7C5CE0;--gold:#9A6700;
 --good:#15803D;--warn:#B26B00;--bad:#C83A26;--good-bg:#DDF4E6;--warn-bg:#FCEFD6;--bad-bg:#FBE1DC;--shadow:0 18px 40px -24px rgba(10,60,70,.4);
 --spot:radial-gradient(120% 90% at 50% 30%,#FFFFFF 0%,#E6F3F3 60%,#D4E8E8 100%);
 --w1:#8ED3D3;--w2:#4FAAB3;--w3:#2E7C88;--air:#E8F4F4;--cab1:#3A3F44;--cab2:#22262A;
 --sea1:#9ED6E6;--sea2:#74BCD3;--land:#F4F1EA;--grid:rgba(0,0,0,.035);--road:#E2D9C7;--road2:#fff;--maplabel:#6B7F7C;
 --hero:radial-gradient(1000px 520px at 75% -10%,rgba(10,154,136,.20),transparent 60%),radial-gradient(800px 500px at 0% 30%,rgba(27,127,214,.12),transparent 60%),linear-gradient(180deg,#DFF1F2 0%,#EEF6F6 100%);color-scheme:light}}
:root[data-theme="light"]{
 --bg:#EEF6F6;--bg2:#E3F0F1;--surface:#FFFFFF;--surface2:#EBF5F5;--surface3:#DDEDED;--glass:rgba(255,255,255,.78);--line:#D3E4E4;--line2:#BFD8D8;
 --ink:#0A2A30;--muted:#4E6E6E;--faint:#7E9A99;--accent:#0A9A88;--accent2:#1B7FD6;--accent-ink:#FFFFFF;--lime:#4D9A12;--lime-ink:#FFFFFF;--coral:#E8553A;--violet:#7C5CE0;--gold:#9A6700;
 --good:#15803D;--warn:#B26B00;--bad:#C83A26;--good-bg:#DDF4E6;--warn-bg:#FCEFD6;--bad-bg:#FBE1DC;--shadow:0 18px 40px -24px rgba(10,60,70,.4);
 --spot:radial-gradient(120% 90% at 50% 30%,#FFFFFF 0%,#E6F3F3 60%,#D4E8E8 100%);
 --w1:#8ED3D3;--w2:#4FAAB3;--w3:#2E7C88;--air:#E8F4F4;--cab1:#3A3F44;--cab2:#22262A;
 --sea1:#9ED6E6;--sea2:#74BCD3;--land:#F4F1EA;--grid:rgba(0,0,0,.035);--road:#E2D9C7;--road2:#fff;--maplabel:#6B7F7C;
 --hero:radial-gradient(1000px 520px at 75% -10%,rgba(10,154,136,.20),transparent 60%),radial-gradient(800px 500px at 0% 30%,rgba(27,127,214,.12),transparent 60%),linear-gradient(180deg,#DFF1F2 0%,#EEF6F6 100%);color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--display);margin:0;letter-spacing:-.015em;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}
@media (min-width:700px){.wrap{padding-inline:24px}}
.muted{color:var(--muted)}.sm{font-size:13.5px}.xs{font-size:12px}.b{font-weight:800}
.ico{flex:none}
img{display:block;max-width:100%}
.cut{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35))}
.wm{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em}.wm b{background:linear-gradient(90deg,var(--accent),var(--lime));-webkit-background-clip:text;background-clip:text;color:transparent}
.ci{display:inline-grid;place-items:center;border-radius:14px;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);flex:none}
/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:12px;height:62px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;color:var(--ink);min-width:0}
.links{display:flex;gap:2px;margin-left:10px}
.links button{background:none;border:0;padding:8px 12px;border-radius:10px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:7px;font-size:14px}
.links button:hover{color:var(--ink);background:var(--surface)}
.links button[aria-current="page"]{color:var(--ink);background:var(--surface2)}
.hr{margin-left:auto;display:flex;gap:6px;align-items:center}
.hbtn{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.hbtn .dot{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--coral);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}
.lvl{display:flex;align-items:center;gap:6px;height:40px;padding:0 10px 0 6px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:13px}
.lvl i{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold),var(--coral));color:#fff;font-style:normal}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 18px;font-weight:800;background:var(--accent);color:var(--accent-ink);text-decoration:none;white-space:nowrap;transition:transform .12s,filter .12s;min-height:44px}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:scale(.97)}
.btn.lime{background:var(--lime);color:var(--lime-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.grad{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 10px 24px -10px color-mix(in srgb,var(--accent) 70%,transparent)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px;min-height:36px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.tabbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:700;white-space:nowrap;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chiprow{display:flex;gap:8px;flex-wrap:wrap}
.hs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;-webkit-overflow-scrolling:touch}.hs::-webkit-scrollbar{display:none}
.eyebrow{display:inline-flex;gap:8px;align-items:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--accent)}
.sec{padding-block:40px}.sechead{display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:18px;flex-wrap:wrap}.sechead h2{font-size:clamp(22px,2.6vw,30px)}
.card0{background:var(--surface);border:1px solid var(--line);border-radius:20px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 11px;font-size:12px;font-weight:800;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--surface2);color:var(--muted)}
/* hero */
.hero{background:var(--hero);border-bottom:1px solid var(--line);overflow:hidden;position:relative}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:28px;align-items:center;padding-block:40px 44px}
.hero h1{font-size:clamp(32px,5vw,58px);line-height:1.03;font-weight:800;margin:12px 0 14px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--lime),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{font-size:17px;color:var(--muted);max-width:48ch;margin-bottom:22px}
.heroart{position:relative}
.heroart .tank3d{width:100%;height:auto;display:block}
.float{position:absolute;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:14px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line2);font-weight:800;font-size:13px;box-shadow:var(--shadow)}
.float img{width:34px;height:24px;object-fit:contain}
.ctas{display:flex;gap:10px;flex-wrap:wrap}
.tpl{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(170px,1fr);gap:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}.tpl::-webkit-scrollbar{display:none}
.tplc{position:relative;border-radius:18px;border:1px solid var(--line);background:var(--spot);padding:0;overflow:hidden;text-align:left;color:var(--ink);min-height:150px}
.tplc .art{height:92px;position:relative}
.tplc .art img{position:absolute;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.tplc .t{padding:8px 12px 12px}.tplc b{font-family:var(--display);display:block}
.bigsearch{position:relative}
.bigsearch input{width:100%;padding:15px 16px 15px 48px;border-radius:16px;border:1px solid var(--line2);background:var(--glass);backdrop-filter:blur(10px);font-size:16px;color:var(--ink)}
.bigsearch>.ico{position:absolute;left:16px;top:16px;color:var(--muted);z-index:2}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;z-index:30;max-height:440px;overflow-y:auto}
.sugg button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-bottom:1px solid var(--line)}
.sugg button:hover,.sugg button.on{background:var(--surface2)}
.th{width:52px;height:38px;border-radius:10px;flex:none;background:var(--spot);display:grid;place-items:center;overflow:hidden}
.th img{width:90%;height:90%;object-fit:contain}
.th svg.illo{width:34px;height:34px}
/* category banners */
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.cat{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);aspect-ratio:5/4;text-align:left;padding:0;color:#fff;isolation:isolate}
.cat .bg{position:absolute;inset:0;z-index:-1}
.cat .ims{position:absolute;inset:0}
.cat .ims>*{position:absolute;transition:transform .5s}
.cat:hover .ims>*{transform:translateY(-4px) scale(1.04)}
.cat .ims img{object-fit:contain;filter:drop-shadow(0 10px 12px rgba(0,0,0,.45))}
.cat .ims svg{filter:drop-shadow(0 10px 12px rgba(0,0,0,.35))}
.cat::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(2,12,16,.82));z-index:0}
.cat .lab{position:absolute;left:14px;right:14px;bottom:12px;z-index:1;display:flex;justify-content:space-between;align-items:end;gap:8px}
.cat b{font-family:var(--display);font-size:18px;display:block}.cat small{opacity:.85;font-weight:700}
.cat .go{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;backdrop-filter:blur(6px)}
/* feature cards */
.feats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.feat{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:0;overflow:hidden;text-align:left;color:var(--ink);display:flex;flex-direction:column}
.feat .art{background:var(--spot);height:170px;position:relative;display:grid;place-items:center;overflow:hidden}
.feat .tx{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px}
.feat h3{font-size:19px}
.vsart{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;width:100%;padding:0 14px}
.vsart img{height:110px;width:100%;object-fit:contain;filter:drop-shadow(0 10px 12px rgba(0,0,0,.4))}
.vsb{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#fff;background:linear-gradient(135deg,var(--coral),#E11D48);box-shadow:0 0 0 6px color-mix(in srgb,var(--coral) 25%,transparent)}
.ring{width:150px;height:150px;border-radius:50%;border:2px solid var(--accent);box-shadow:0 0 40px color-mix(in srgb,var(--accent) 45%,transparent),inset 0 0 30px color-mix(in srgb,var(--accent) 25%,transparent);display:grid;place-items:center;position:relative;overflow:hidden}
.ring img{width:84%;height:84%;object-fit:contain}
.ring::after{content:"";position:absolute;left:8%;right:8%;height:2px;background:var(--accent);box-shadow:0 0 12px var(--accent);top:20%;animation:scanl 2.4s ease-in-out infinite alternate}
@keyframes scanl{to{top:80%}}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,230px);gap:14px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
/* map banner */
.mapban{position:relative;border-radius:24px;overflow:hidden;border:1px solid var(--line);min-height:300px;display:block;width:100%;padding:0;text-align:left;color:var(--ink);background:var(--land)}
.mapsvg{position:absolute;inset:0;width:100%;height:100%}
.mapsvg .pin{animation:drop .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes drop{from{transform:translateY(-30px);opacity:0}}
.mapsvg .pulse{animation:pulse 2s ease-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{0%{transform:scale(.4);opacity:.6}100%{transform:scale(2.2);opacity:0}}
.mapcard{position:absolute;left:18px;top:18px;max-width:340px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line2);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.mapchip{position:absolute;right:18px;bottom:18px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow);max-width:calc(100% - 36px)}
/* explore */
.explore{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;padding-block:24px 60px}
.explore>div{min-width:0}
.side{position:sticky;top:80px;align-self:start;display:flex;flex-direction:column;gap:3px;max-height:calc(100vh - 96px);overflow:auto;padding-right:4px}
.side .m{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:12px;padding:8px 10px;font-weight:800;color:var(--ink)}
.side .m em{margin-left:auto;font-style:normal;font-size:12px;color:var(--faint);font-weight:700}
.side .m[aria-current="true"]{background:var(--surface2)}
.side .s{display:block;width:100%;text-align:left;background:none;border:0;padding:6px 10px 6px 58px;font-size:13.5px;color:var(--muted);border-radius:8px;font-weight:600}
.side .s[aria-current="true"]{color:var(--accent);font-weight:800}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.searchin{flex:1 1 240px;position:relative;display:block}
.searchin input{width:100%;padding:12px 14px 12px 42px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:46px}
.searchin .ico{position:absolute;left:14px;top:14px;color:var(--muted)}
.mobcats{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,border-color .15s;min-width:0;position:relative}
.card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.card .ph{position:relative;aspect-ratio:4/3;background:var(--spot);border:0;padding:12px 10px;width:100%;display:grid;place-items:center}
.card .ph img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 12px 14px rgba(0,0,0,.4));transition:transform .3s}
.card:hover .ph img{transform:scale(1.04)}
.card .ph svg.illo{width:62%;height:auto;max-height:100%}
.card .body{padding:12px 13px 13px;display:flex;flex-direction:column;gap:7px;flex:1}
.card .nm{font-family:var(--display);font-weight:700;font-size:15.5px;line-height:1.25;background:none;border:0;padding:0;text-align:left;color:var(--ink)}
.card .sci{font-size:12.5px;color:var(--muted);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ovl{position:absolute;left:10px;top:10px;display:flex;gap:6px;z-index:2}.ovr{position:absolute;right:10px;top:10px;z-index:2}
.diff{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 10px 4px 8px;font-size:11.5px;font-weight:800;color:#fff}
.diff.d1{background:#15803D}.diff.d2{background:#C2780A}.diff.d3{background:#C2342A}
.diff .bars{display:flex;gap:2px;align-items:end}.diff .bars i{width:3px;border-radius:1px;background:rgba(255,255,255,.35)}.diff .bars i.f{background:#fff}
.tagcat{background:rgba(3,22,27,.6);color:#fff;border-radius:99px;padding:4px 9px;font-size:11px;font-weight:800;backdrop-filter:blur(6px)}
.icons{display:flex;flex-wrap:wrap;gap:5px}
.ic{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;border-radius:9px;padding:4px 8px;background:var(--surface2);color:var(--muted)}
.ic .ico{width:14px;height:14px}
.ic.p{color:var(--good);background:var(--good-bg)}.ic.s{color:var(--warn);background:var(--warn-bg)}.ic.a{color:var(--bad);background:var(--bad-bg)}
.ic.price{color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent)}
.cardacts{display:flex;gap:6px;margin-top:auto;padding-top:4px}.cardacts .btn{flex:1}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}
/* sheets */
.modal{position:fixed;inset:0;z-index:60;background:rgba(2,12,15,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;justify-content:flex-end}
.modal.center{justify-content:center;align-items:center;padding:16px}
.sheet{width:min(780px,100%);height:100%;background:var(--bg);border-left:1px solid var(--line);display:flex;flex-direction:column;animation:slide .25s ease-out}
.sheet .scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.dialog{width:min(560px,100%);max-height:calc(100% - 32px);background:var(--bg);border:1px solid var(--line);border-radius:24px;display:flex;flex-direction:column;overflow:hidden;animation:pop .2s ease-out;box-shadow:var(--shadow)}
.dialog .scroll{overflow-y:auto;padding:20px}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.close{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink);flex:none}
.dhero{position:relative;background:var(--spot);height:300px;display:grid;place-items:center;padding:30px 20px 50px}
.dhero img{height:100%;width:100%;min-height:0;object-fit:contain;filter:drop-shadow(0 18px 20px rgba(0,0,0,.45))}
.dhero .tile{width:180px}
.dhero .close{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top,0px));z-index:3}
.dbody{padding:0 22px 30px;margin-top:-30px;position:relative;z-index:2}
.dbody h2{font-size:30px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:18px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;min-width:0}
.stat b{display:block;font-size:15px;font-family:var(--display);line-height:1.2}.stat span{font-size:12px;color:var(--muted);font-weight:700}
.dsec{margin-top:24px}
.dsec>h3{font-size:17px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.dsec>p{color:var(--muted)}
.mini{display:flex;gap:8px;flex-wrap:wrap}
.minic{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px 12px 5px 5px;font-size:13px;font-weight:700;color:var(--ink);text-align:left;max-width:100%}
.minic .th{width:46px;height:34px}
.minic small{display:block;color:var(--muted);font-weight:600;font-size:11.5px}
.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.list li{display:flex;gap:9px;align-items:flex-start;color:var(--muted)}
.dzcard{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px;text-align:left;color:var(--ink);width:100%}
.dzcard .dzsvg{width:92px;height:62px;background:var(--spot);border-radius:12px}
.dactions{display:flex;gap:10px;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -10px 30px -18px rgba(0,0,0,.5);flex:none}
.dactions .btn{flex:1}
.warnbox{display:flex;gap:12px;border-radius:16px;padding:14px;background:var(--bad-bg);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent);margin-top:16px}
.infobox{display:flex;gap:12px;border-radius:16px;padding:14px;background:var(--surface2);border:1px solid var(--line)}
.varg{display:grid;grid-auto-flow:column;grid-auto-columns:150px;gap:10px;overflow-x:auto;padding-bottom:6px}
.varc{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.varc .im{height:90px;background:var(--spot);padding:8px;display:grid;place-items:center}
.varc .im img{width:100%;height:100%;object-fit:contain}
.varc div.t{padding:8px 10px;font-size:12px;color:var(--muted)}.varc b{display:block;color:var(--ink);font-size:13px}
.sexgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sexp{background:var(--spot);border:1px solid var(--line);border-radius:16px;padding:10px;min-width:0}
.sexh{font-weight:800;color:var(--c);font-family:var(--display)}
.sexsvg{width:100%;height:auto;overflow:visible}
.sexsvg text{paint-order:stroke;stroke:var(--surface);stroke-width:4px}
.sexrows{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.sexrows div{border-radius:14px;padding:10px 12px;font-size:13.5px}
.dzwrap{display:grid;grid-template-columns:1fr 2.2fr;gap:10px;align-items:center;background:var(--spot);border-radius:16px;padding:12px;border:1px solid var(--line)}
.dzwrap .dzsvg{width:100%;height:auto;overflow:visible}
.dzwrap text{paint-order:stroke;stroke:var(--surface);stroke-width:4px}
.growth svg{width:100%;height:auto}
/* compare */
.modes{display:inline-flex;gap:4px;background:var(--surface2);padding:4px;border-radius:14px}
.modes button{border:0;background:transparent;border-radius:11px;padding:8px 14px;font-weight:800;color:var(--muted);display:flex;gap:7px;align-items:center}
.modes button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.arena{display:grid;grid-template-columns:minmax(0,1fr) 190px minmax(0,1fr);gap:14px;align-items:stretch;margin-top:18px}
.fighter{background:var(--spot);border:1px solid var(--line);border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;min-width:0}
.fighter .im{height:200px;display:grid;place-items:center}
.fighter .im img{max-height:100%;width:100%;object-fit:contain;filter:drop-shadow(0 16px 18px rgba(0,0,0,.45))}
.fighter.r .im img{transform:scaleX(-1)}
.fighter h3{font-size:20px}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.dial{width:170px;height:170px;position:relative}
.dial svg{width:100%;height:100%}
.dial .v{position:absolute;inset:0;display:grid;place-items:center;align-content:center}
.dial .v b{font-family:var(--display);font-size:40px;line-height:1}
.statbars{display:grid;gap:12px;margin-top:6px}
.sbar{display:grid;grid-template-columns:minmax(0,1fr) 130px minmax(0,1fr);gap:10px;align-items:center}
.sbar .l,.sbar .r{height:12px;border-radius:99px;background:var(--surface2);position:relative;overflow:hidden}
.sbar .l i{position:absolute;right:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(270deg,var(--accent),var(--accent2));transition:width .8s}
.sbar .r i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--coral),var(--gold));transition:width .8s}
.sbar .m{text-align:center;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sbar .m small{display:block;text-transform:none;letter-spacing:0;color:var(--ink);font-size:12.5px}
.reason{display:flex;gap:12px;align-items:flex-start;border-radius:16px;padding:12px 14px;background:var(--surface);border:1px solid var(--line)}
.reason.bad{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:var(--bad-bg)}.reason.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:var(--warn-bg)}.reason.good{border-color:color-mix(in srgb,var(--good) 45%,var(--line));background:var(--good-bg)}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.pick{background:var(--spot);border:1px solid var(--line);border-radius:16px;padding:8px;text-align:center;color:var(--ink);display:flex;flex-direction:column;gap:4px;align-items:center}
.pick img{width:100%;height:70px;object-fit:contain;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35))}
.pick b{font-size:12.5px;line-height:1.2}
.matrix{display:grid;gap:6px}
.mcell{border-radius:12px;display:grid;place-items:center;font-weight:800;font-family:var(--display);min-height:56px;padding:4px}
.quiz{max-width:720px;margin:0 auto;text-align:center}
.qarena{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:var(--spot);border:1px solid var(--line);border-radius:24px;padding:20px}
.qarena img{height:150px;width:100%;object-fit:contain;filter:drop-shadow(0 14px 16px rgba(0,0,0,.4))}
.qbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.qbtns .btn{min-height:64px;font-size:15px;flex-direction:column;gap:2px}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--surface3)}.dots i.ok{background:var(--good)}.dots i.no{background:var(--bad)}.dots i.cur{background:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:linear-gradient(135deg,var(--gold),var(--coral));color:#fff;font-weight:800;padding:10px 16px;border-radius:99px;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center;animation:toast 2.6s ease forwards;pointer-events:none;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-10px)}}
/* planner */
.plan{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:24px;padding-block:20px 120px;align-items:start}
.plan>div{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;min-width:0}
.stickyp{position:sticky;top:78px}
.prog{display:flex;gap:6px;margin:12px 0 16px;overflow-x:auto;scrollbar-width:none}.prog::-webkit-scrollbar{display:none}
.prog button{flex:1 0 auto;border:0;background:none;padding:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start;color:var(--muted);font-weight:800;font-size:12.5px;min-width:74px}
.prog button i{display:block;height:6px;width:100%;border-radius:99px;background:var(--surface3)}
.prog button.done i{background:var(--accent)}.prog button[aria-current="step"]{color:var(--ink)}.prog button[aria-current="step"] i{background:linear-gradient(90deg,var(--accent),var(--lime))}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800;margin:18px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.lbl:first-child{margin-top:0}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.opt{position:relative;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:800;text-align:center;color:var(--ink);min-width:0}
.opt small{font-weight:600;color:var(--muted);font-size:11.5px;line-height:1.3}
.opt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface));box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.opt[aria-pressed="true"]::after{content:"✓";position:absolute;top:6px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px;display:grid;place-items:center}
.opt svg.illo{width:62px;height:62px}
.opt .sw{width:100%;height:46px;border-radius:10px}
.typec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.typec .opt{padding:0;overflow:hidden;align-items:stretch;text-align:left}
.typec .opt .art{height:96px;display:grid;place-items:center}
.typec .opt .t{padding:10px 12px 12px}
.dims{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:700;min-width:0}
.field input,.field select{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--bg);color:var(--ink);width:100%;font-weight:700;min-height:46px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 14px;font-weight:800;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.vol{margin-top:14px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.vol b{font-family:var(--display);font-size:30px}
/* livestock picker cards */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.lc{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;position:relative;min-width:0;transition:border-color .15s}
.lc.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.lc .tap{position:relative;border:0;padding:10px 8px 4px;background:var(--spot);aspect-ratio:1/0.82;display:grid;place-items:center;width:100%;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.lc .tap img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 12px rgba(0,0,0,.4));transition:transform .15s}
.lc .tap:active img{transform:scale(.93)}
.lc .cnt{position:absolute;right:8px;top:8px;min-width:34px;height:34px;padding:0 8px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:800;font-size:17px;display:grid;place-items:center;box-shadow:0 6px 14px -6px rgba(0,0,0,.5)}
.lc .tapl{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:11px;font-weight:800;color:var(--muted);opacity:.8}
.lc .info{position:absolute;left:8px;top:8px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.35);color:#fff;display:grid;place-items:center;z-index:2}
.lc .pop{position:absolute;left:50%;top:40%;font-family:var(--display);font-weight:800;color:var(--accent);font-size:26px;pointer-events:none;animation:plus .7s ease-out forwards}
@keyframes plus{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-40px);opacity:0}}
.lc .bd{padding:9px 10px 10px;display:flex;flex-direction:column;gap:6px;flex:1}
.lc .nm{font-family:var(--display);font-weight:700;font-size:14px;line-height:1.2}
.lc .icons .ic{font-size:11px;padding:3px 6px}
.lc .icons .ico{width:12px;height:12px}
.stepper{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:4px;margin-top:auto;background:var(--surface2);border-radius:12px;padding:3px}
.stepper button{height:36px;border-radius:10px;border:0;background:var(--surface);font-weight:800;font-size:18px;color:var(--ink);display:grid;place-items:center}
.stepper input{width:100%;text-align:center;border:0;background:transparent;font-weight:800;font-family:var(--display);font-size:16px;color:var(--ink)}
.grp{font-size:11.5px;font-weight:800;color:var(--warn)}.grp.ok{color:var(--good)}
.vsel{width:100%;border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--bg);font-size:12px;font-weight:700;color:var(--ink)}
.intank{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.intank span{flex:none;display:flex;align-items:center;gap:6px;background:var(--surface2);border-radius:99px;padding:3px 10px 3px 3px;font-size:12.5px;font-weight:800}
.intank img{width:34px;height:34px;border-radius:50%;object-fit:contain;background:var(--spot)}
.swrow{display:flex;justify-content:space-between;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);gap:10px}
.swrow>span{display:flex;gap:10px;align-items:center;font-weight:700}
.switch{width:48px;height:28px;border-radius:99px;border:0;background:var(--line2);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch[aria-checked="true"]{background:var(--accent)}.switch[aria-checked="true"]::after{left:23px}
.tank3d{width:100%;height:auto;display:block}
.tank3d .swim{animation:swim var(--d,6s) ease-in-out infinite alternate}
@keyframes swim{from{transform:translateX(-7px)}to{transform:translateX(7px)}}
.tank3d .sway{animation:sway 5s ease-in-out infinite alternate}
@keyframes sway{from{transform:skewX(-2deg)}to{transform:skewX(2deg)}}
.tank3d .bub{animation:rise 3s linear infinite}
@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-140px);opacity:0}}
.tank3d .ray{animation:ray 7s ease-in-out infinite alternate}
@keyframes ray{from{opacity:.05}to{opacity:.22}}
.bar{height:9px;border-radius:99px;background:var(--surface2);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px}
.issue{border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:14px;padding:11px 13px;font-size:13.5px;background:var(--bg);display:flex;gap:10px;align-items:flex-start}
.issue.bad{border-left-color:var(--bad)}.issue.warn{border-left-color:var(--warn)}.issue.good{border-left-color:var(--good)}.issue.info{border-left-color:var(--accent2)}
.issue b{display:block;color:var(--ink)}
.verdict{display:flex;gap:14px;align-items:center;border-radius:18px;padding:14px}
.verdict.good{background:var(--good-bg)}.verdict.warn{background:var(--warn-bg)}.verdict.bad{background:var(--bad-bg)}.verdict.info{background:var(--surface2)}
.verdict .dot{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.verdict.good .dot{background:var(--good)}.verdict.warn .dot{background:var(--warn)}.verdict.bad .dot{background:var(--bad)}.verdict.info .dot{background:var(--faint)}
.wt{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.costt{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.costt td{padding:9px 4px;border-bottom:1px solid var(--line)}.costt td:last-child{text-align:right;font-weight:800;white-space:nowrap}
.costt tr.tot td{border-bottom:0;font-size:16px;font-family:var(--display);padding-top:12px}
.footbar{position:fixed;left:0;right:0;bottom:0;z-index:44;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;box-shadow:0 -10px 30px -18px rgba(0,0,0,.5)}
.footbar .sum{flex:1;min-width:0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.footbar .sum b{color:var(--ink);font-size:14px}
.choicehero{position:relative;border-radius:26px;overflow:hidden;border:1px solid var(--line);background:var(--hero);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:center;gap:16px;padding:26px}
.tanks{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:12px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:8px}
.typeb{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.ev{display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.flag{color:var(--bad);font-weight:800}
.alert{border-radius:16px;padding:12px 14px;background:var(--bad-bg);border:1px solid var(--bad);margin-bottom:14px}
.prow{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:16px;background:var(--bg)}
.prow .th{width:62px;height:46px}
.reasons{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
/* scanner */
.cam{position:fixed;inset:0;z-index:70;background:#02090C;color:#fff;display:flex;flex-direction:column}
.cam .top{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 8px}
.cam .btn.ghost{background:#10313C;border-color:#1C4351;color:#EAF7F5}.cam .seg{border-color:#1C4351}.cam .seg button{background:#10313C;color:#93B6B1}.cam .seg button[aria-pressed="true"]{background:#38E1C6;color:#02343A}.cam .top .close{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.15);color:#fff}
.cam .body{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:6px 16px 20px;gap:14px}
.vf{position:relative;width:min(560px,100%);aspect-ratio:4/3;border-radius:24px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#0E3A44,#041418);flex:none}
.vf img,.vf video{width:100%;height:100%;object-fit:cover}

 background:radial-gradient(120% 80% at 50% 0%,color-mix(in srgb,var(--mc) 55%,#06141A) 0%,color-mix(in srgb,var(--mc) 22%,#071A21) 45%,#061217 100%);
 box-shadow:0 22px 40px -22px color-mix(in srgb,var(--mc) 80%,transparent),inset 0 1px 0 rgba(255,255,255,.12);
 animation:qmIn .55s cubic-bezier(.2,.9,.25,1.15) both;animation-delay:var(--d);transition:transform .2s,box-shadow .2s}

.qm-b.b1{width:12px;height:12px;left:12%;bottom:18%}.qm-b.b2{width:8px;height:8px;left:84%;bottom:30%;animation-delay:1.1s}.qm-b.b3{width:16px;height:16px;left:72%;bottom:10%;animation-delay:2s}
.qm-f{position:absolute;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45));opacity:.95}
.qm-f.f1{width:44%;right:-6%;bottom:6%;animation:qmSwim 3.2s ease-in-out 2 both}
.qm-f.f2{width:30%;left:-5%;top:20%;opacity:.55;transform:scaleX(-1);filter:blur(.5px) drop-shadow(0 8px 10px rgba(0,0,0,.4))}
.qm-shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.22) 50%,transparent 65%);transform:translateX(-120%);animation:qmShine 1.4s ease .6s 1 both;animation-delay:calc(var(--d) + .6s)}
.qm-top{position:absolute;top:14px;left:14px}

.qm-medal{position:relative;width:78px;height:78px;border-radius:24px;display:grid;place-items:center;margin-top:6px;color:#fff;
 background:linear-gradient(145deg,color-mix(in srgb,var(--mc) 85%,#fff),var(--mc) 55%,color-mix(in srgb,var(--mc) 60%,#000));box-shadow:0 14px 26px -10px var(--mc),inset 0 2px 0 rgba(255,255,255,.45),inset 0 -4px 0 rgba(0,0,0,.18);transform:rotate(-6deg);animation:qmPop .6s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--d) + .15s)}
.qm-medal .ico{filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));transform:rotate(6deg)}

.qm-title{font-family:'Cinzel',var(--display),serif;font-size:26px;font-weight:700;letter-spacing:.02em;margin-top:10px;text-shadow:0 3px 12px rgba(0,0,0,.45);line-height:1.1}

.qm-play{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:auto;min-width:170px;padding:13px 26px;border-radius:999px;font-weight:900;font-size:16px;letter-spacing:.14em;color:#0B1B22;
 background:linear-gradient(180deg,#fff,color-mix(in srgb,var(--mc) 25%,#fff));box-shadow:0 10px 22px -8px var(--mc),0 0 0 4px color-mix(in srgb,var(--mc) 30%,transparent);animation:qmPulse 1.2s ease-in-out 2 both;animation-delay:calc(var(--d) + .9s)}
